name: Generate Windows ARM64 bindings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: aarch64-pc-windows-msvc
    runs-on: windows-11-arm
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify miniaudio submodule
        shell: pwsh
        run: |
          if (-not (Test-Path "crates/maudio-sys/native/miniaudio/miniaudio.h")) {
              throw "miniaudio.h was not found"
          }

          git submodule status --recursive

      - name: Configure Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-pc-windows-msvc

      - name: Generate bindings
        shell: pwsh
        env:
          CARGO_TARGET_DIR: target/bindgen-aarch64-pc-windows-msvc
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath

          if (-not $vsPath) {
              throw "Visual Studio with the ARM64 C++ toolchain was not found"
          }

          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"

          Enter-VsDevShell `
            -VsInstallPath $vsPath `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=arm64 -host_arch=arm64"

          Write-Host "Processor: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Visual Studio: $vsPath"

          rustc -vV
          cargo -V
          clang --version

          $cl = Get-Command cl.exe -ErrorAction Stop
          Write-Host "MSVC compiler: $($cl.Source)"
          cl 2>&1 | Select-Object -First 3

          cargo build `
            -p maudio-sys `
            --target aarch64-pc-windows-msvc `
            --features generate-bindings

      - name: Collect bindings
        shell: pwsh
        run: |
          $bindingFile = Get-ChildItem `
              -Path "target/bindgen-aarch64-pc-windows-msvc" `
              -Recurse `
              -Filter "bindings.rs" |
            Where-Object {
              $_.FullName -match '[\\/]build[\\/]maudio-sys-[^\\/]+[\\/]out[\\/]bindings\.rs$'
            } |
            Select-Object -First 1

          if (-not $bindingFile) {
              throw "Generated bindings.rs was not found"
          }

          New-Item -ItemType Directory `
            -Path "generated-bindings" `
            -Force | Out-Null

          Copy-Item `
            $bindingFile.FullName `
            "generated-bindings/aarch64-pc-windows-msvc.rs"

      - name: Upload bindings
        uses: actions/upload-artifact@v4
        with:
          name: bindings-aarch64-pc-windows-msvc
          path: generated-bindings/aarch64-pc-windows-msvc.rs
          if-no-files-found: error