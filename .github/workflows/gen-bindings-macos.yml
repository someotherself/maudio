name: Generate macOS bindings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel

          - target: aarch64-apple-darwin
            runner: macos-15

          - target: aarch64-apple-ios
            runner: macos-15

          - target: aarch64-apple-ios-sim
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify miniaudio submodule
        run: |
          test -f crates/maudio-sys/native/miniaudio/miniaudio.h
          git submodule status --recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show build environment
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          clang --version
          rustc -vV

      - name: Verify runner architecture
        run: |
          case "${{ matrix.runner }}" in
            macos-15-intel)
              test "$(uname -m)" = "x86_64"
              ;;
            macos-15)
              test "$(uname -m)" = "arm64"
              ;;
            *)
              echo "Unexpected runner: ${{ matrix.runner }}"
              exit 1
              ;;
          esac

      - name: Generate bindings
        env:
          CARGO_TARGET_DIR: target/bindgen-${{ matrix.target }}
        run: |
          cargo build \
            -p maudio-sys \
            --target "${{ matrix.target }}" \
            --features generate-bindings

      - name: Collect bindings
        run: |
          binding_file="$(
            find "target/bindgen-${{ matrix.target }}" \
              -path "*/build/maudio-sys-*/out/bindings.rs" \
              -print \
              -quit
          )"

          if [[ -z "$binding_file" ]]; then
            echo "Generated bindings.rs was not found."
            exit 1
          fi

          mkdir -p generated-bindings
          cp "$binding_file" \
            "generated-bindings/${{ matrix.target }}.rs"

      - name: Upload bindings
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: generated-bindings/${{ matrix.target }}.rs
          if-no-files-found: error