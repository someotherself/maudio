name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --features ci-tests --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: "ci-tests"
          - os: windows-latest
            features: "ci-tests"
          - os: macos-latest
            features: "ci-tests generate-bindings"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Set LIBCLANG_PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      - name: Run tests
        run: cargo test --features "${{ matrix.features }}" --all-targets

      - name: Run Symphonia decoder integration checks
        run: >
          cargo run
          -p maudio-tests
          --bin symphonia_decoder
          --features symphonia-decoder

  address-sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-Zsanitizer=address"
      RUSTDOCFLAGS: "-Zsanitizer=address"
      CFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
      CXXFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests with AddressSanitizer
        run: >
          cargo test
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          --features ci-tests
          --all-targets

      - name: Run Symphonia decoder checks with AddressSanitizer
        run: >
          cargo run
          -Zbuild-std
          --target x86_64-unknown-linux-gnu
          -p maudio-tests
          --bin symphonia_decoder
          --features symphonia-decoder